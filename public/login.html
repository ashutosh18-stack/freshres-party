<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fresher Party Entry Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 sm:p-6 antialiased">

  <div class="w-full max-w-md mx-auto">
    <!-- Brand Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 text-white shadow-md shadow-blue-500/20 mb-3">
        <i class="fa-solid fa-ticket-simple text-2xl"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">
        Fresher Fiesta 2026
      </h1>
      <p class="text-slate-500 text-xs sm:text-sm mt-1 font-medium">Entry Pass & Gate Verification Platform</p>
    </div>

    <!-- Mobile Connect Banner (Visible when live link active) -->
    <div id="mobile-live-banner" class="hidden mb-5 bg-gradient-to-r from-blue-600 to-indigo-700 text-white rounded-2xl p-4 shadow-lg border border-blue-400/30">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs font-bold uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-mobile-screen-button text-amber-300"></i> Mobile Live Scanner Link
        </span>
        <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-extrabold bg-emerald-400 text-slate-900 uppercase tracking-wider shadow-sm">
          Live Online
        </span>
      </div>
      <p class="text-[11px] text-blue-100 mb-2.5">Open this URL on phone browsers for volunteer camera gate scanning:</p>
      <div class="flex items-center gap-2 bg-slate-950/40 border border-white/20 rounded-xl p-2">
        <input id="mobile-link-input" type="text" readonly class="bg-transparent text-xs text-white font-mono flex-1 outline-none select-all px-1">
        <button id="copy-mobile-link" type="button" class="px-3 py-1.5 bg-white text-blue-700 hover:bg-blue-50 text-xs font-bold rounded-lg transition active:scale-95 flex items-center gap-1.5 shadow-sm shrink-0">
          <i class="fa-regular fa-copy"></i>
          <span>Copy</span>
        </button>
      </div>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200">
      
      <!-- Security Status Badge -->
      <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-5">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></span>
          <span class="text-xs uppercase tracking-wider font-bold text-blue-700">Official Portal</span>
        </div>
        <span class="text-xs text-slate-500 flex items-center gap-1.5 font-medium">
          <i class="fa-solid fa-lock text-blue-600 text-xs"></i> 256-bit Encrypted
        </span>
      </div>

      <!-- Error Alert -->
      <div id="login-error" class="hidden mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs sm:text-sm flex items-start gap-2.5">
        <i class="fa-solid fa-circle-exclamation mt-0.5 text-rose-600 shrink-0"></i>
        <span id="login-error-text">Invalid email or password</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-4 sm:space-y-5">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="email">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-regular fa-envelope text-blue-600"></i>
            </div>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required
              placeholder="name@college.edu"
              class="w-full pl-10 pr-4 py-2.5 sm:py-3 bg-white border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm transition shadow-sm"
            >
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700" for="password">
              Password
            </label>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-key text-blue-600"></i>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              placeholder="••••••••"
              class="w-full pl-10 pr-10 py-2.5 sm:py-3 bg-white border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm transition shadow-sm"
            >
            <button 
              type="button" 
              id="togglePassword" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition"
              aria-label="Toggle password visibility"
            >
              <i class="fa-regular fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="btnSubmit"
          class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-sm transition duration-150 flex items-center justify-center gap-2 active:scale-[0.99]"
        >
          <span>Sign In to Platform</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>


    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-500 mt-6 font-medium">
      Fresher Party Management System &copy; 2026. Secure Access Only.
    </p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Toggle password visibility
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      eyeIcon.classList.toggle('fa-eye');
      eyeIcon.classList.toggle('fa-eye-slash');
    });

    // Handle Login Submit
    const loginForm = document.getElementById('loginForm');
    const errorBox = document.getElementById('login-error');
    const errorText = document.getElementById('login-error-text');
    const btnSubmit = document.getElementById('btnSubmit');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-sm"></i> Authenticating...`;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed');
        }

        // Save auth state
        API.setAuth(data.token, data.user);
        API.toast(`Welcome back, ${data.user.name}!`, 'success');

        // Redirect based on role
        setTimeout(() => {
          if (data.user.role === 'admin') {
            window.location.href = '/dashboard.html';
          } else {
            window.location.href = '/scanner.html';
          }
        }, 500);

      } catch (err) {
        errorText.textContent = err.message;
        errorBox.classList.remove('hidden');
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>Sign In to Platform</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
      }
    });

    // Check & display live mobile scanner link
    fetch('/live_status.json?t=' + Date.now())
      .then(res => res.json())
      .then(data => {
        if (data && (data.scannerUrl || data.tunnelUrl)) {
          const mobileUrl = data.scannerUrl || `${data.tunnelUrl}/scanner.html`;
          const input = document.getElementById('mobile-link-input');
          const banner = document.getElementById('mobile-live-banner');
          const copyBtn = document.getElementById('copy-mobile-link');
          
          input.value = mobileUrl;
          banner.classList.remove('hidden');
          
          copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(mobileUrl).then(() => {
              API.toast('Mobile scanner link copied to clipboard!', 'success');
            }).catch(() => {
              input.select();
              document.execCommand('copy');
              API.toast('Link copied!', 'success');
            });
          });
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
